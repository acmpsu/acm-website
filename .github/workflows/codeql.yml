name: CodeQL

# Static analysis of the code in this repository. Results land in the Security
# tab, not in the merge gate: CodeQL is deliberately kept out of ci-ok's needs so
# a new query release cannot block unrelated pull requests.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 07:24 UTC. Catches newly published queries against code
    # that has not changed.
    - cron: "24 7 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Scoped to this job only. security-events: write is what uploads alerts.
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          # No compilation needed: CodeQL reads the source directly, so this
          # workflow needs neither npm ci nor a Next.js build.
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:javascript-typescript"
