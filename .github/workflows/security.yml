name: Security

# Checks installed dependencies against the npm advisory database.
#
# This is a scheduled report, NOT a pull request gate. An advisory can be
# published for a transitive dependency with no fix available, which would block
# every unrelated pull request until upstream patches it. Running on a cron keeps
# the signal without coupling it to merges. For the same reason there is no
# continue-on-error here: a red run should be visible, not hidden.

on:
  schedule:
    # Daily, 09:17 UTC. The advisory database changes even when the lockfile does not.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm audit --audit-level=high
