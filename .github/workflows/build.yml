name: Build

# Production Next.js build. Catches what the other checks cannot: server/client
# boundary violations, prerender-time crashes, and import casing that only
# breaks on a case-sensitive filesystem.
#
# The job always runs to completion and always reports a status. A docs-only
# change skips the STEPS, not the job.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: changes
        if: github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/changes

      - if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.code == 'true'
        uses: ./.github/actions/setup

      # Only .next/cache is cached. Caching .next/types would restore stale
      # route validators and fail the build after a route is renamed.
      - if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.code == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      # Supabase env vars are intentionally absent. src/lib/supabase/env.ts
      # defaults them to "" and the app degrades through isSupabaseConfigured.
      - if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.code == 'true'
        run: npm run build

      - name: Summary
        env:
          EVENT: ${{ github.event_name }}
          CODE: ${{ steps.changes.outputs.code }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Ran: manual dispatch."
          elif [ "$CODE" = "true" ]; then
            echo "Ran: code changed."
          else
            echo "Skipped: docs-only change."
          fi
